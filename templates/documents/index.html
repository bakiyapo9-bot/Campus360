<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Documents administratifs · Campus360</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="../../static/css/campus360.css" rel="stylesheet">
</head>
<body data-page="documents" data-roles="admin,scolarite,comptable,etudiant">
<div class="app-shell">
  <aside id="c360-sidebar" class="app-sidebar" aria-label="Navigation principale"></aside>
  <div class="app-main">
    <header id="c360-topbar" class="app-topbar"></header>
    <main class="app-content">
      <div class="page-header">
        <div>
          <h1>Documents administratifs</h1>
          <nav aria-label="Fil d'Ariane"><ol class="breadcrumb"><li class="breadcrumb-item"><a href="../dashboard/index.html">Accueil</a></li><li class="breadcrumb-item active">Documents</li></ol></nav>
        </div>
      </div>

      <div class="card mb-3" id="studentPicker">
        <div class="card-body">
          <label class="form-label fw-semibold" for="docStudent">1. Choisir l'étudiant</label>
          <div class="position-relative" style="max-width:560px">
            <input type="search" id="docStudent" class="form-control" placeholder="Nom ou matricule…" autocomplete="off">
            <div class="list-group position-absolute w-100 shadow" id="docResults" style="z-index:5"></div>
          </div>
          <div id="docSelected" class="mt-2"></div>
        </div>
      </div>

      <h6 class="fw-semibold mb-2" id="step2Label">2. Générer un document</h6>
      <div class="row g-3 mb-4" id="docTypes"></div>

      <div class="card" id="piecesCard">
        <div class="card-header d-flex align-items-center"><h5>Pièces justificatives déposées</h5><select id="fPieceStatut" class="form-select form-select-sm ms-auto" style="width:auto" aria-label="Filtrer par statut"><option value="">Tous</option><option selected>En attente</option><option>Vérifié</option><option>Rejetée</option></select></div>
        <div class="table-responsive"><table class="table table-hover"><thead><tr><th>Étudiant</th><th>Pièce</th><th>Fichier</th><th>Déposée le</th><th>Statut</th><th class="text-end">Actions</th></tr></thead><tbody id="piecesBody"></tbody></table></div>
      </div>
    </main>
    <footer class="app-footer"></footer>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="../../static/js/mock-data.js"></script>
<script src="../../static/js/services.js"></script>
<script src="../../static/js/core.js"></script>
<script src="../../static/js/pages/documents.js"></script>
</body>
</html>
