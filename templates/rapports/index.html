<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Rapports & statistiques · Campus360</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="../../static/css/campus360.css" rel="stylesheet">
</head>
<body data-page="rapports" data-roles="admin,scolarite,comptable">
<div class="app-shell">
  <aside id="c360-sidebar" class="app-sidebar" aria-label="Navigation principale"></aside>
  <div class="app-main">
    <header id="c360-topbar" class="app-topbar"></header>
    <main class="app-content">
      <div class="page-header">
        <div>
          <h1>Rapports & statistiques</h1>
          <nav aria-label="Fil d'Ariane"><ol class="breadcrumb"><li class="breadcrumb-item"><a href="../dashboard/index.html">Accueil</a></li><li class="breadcrumb-item active">Rapports</li></ol></nav>
        </div>
        <div class="actions no-print">
          <input type="date" id="rDu" class="form-control" style="width:auto" aria-label="Recettes du">
          <input type="date" id="rAu" class="form-control" style="width:auto" aria-label="Recettes au">
          <button class="btn btn-light" data-print><i class="bi bi-file-earmark-pdf me-1"></i>Exporter en PDF</button>
        </div>
      </div>

      <div class="row g-3">
        <div class="col-xl-6" data-section="academique">
          <div class="card h-100"><div class="card-header d-flex align-items-center"><h5>Effectifs par année académique</h5><button class="btn btn-sm btn-light ms-auto no-print" data-export="annees"><i class="bi bi-file-earmark-excel"></i> Excel</button></div>
            <div class="card-body"><div class="chart-box-sm"><canvas id="cAnnees" role="img" aria-label="Effectifs par année"></canvas></div></div></div>
        </div>
        <div class="col-xl-6" data-section="academique">
          <div class="card h-100"><div class="card-header d-flex align-items-center"><h5>Effectifs par filière</h5><button class="btn btn-sm btn-light ms-auto no-print" data-export="filieres"><i class="bi bi-file-earmark-excel"></i> Excel</button></div>
            <div class="card-body"><div class="chart-box-sm"><canvas id="cFilieres" role="img" aria-label="Effectifs par filière"></canvas></div></div></div>
        </div>
        <div class="col-xl-4" data-section="academique">
          <div class="card h-100"><div class="card-header d-flex align-items-center"><h5>Répartition par niveau</h5><button class="btn btn-sm btn-light ms-auto no-print" data-export="niveaux"><i class="bi bi-file-earmark-excel"></i> Excel</button></div>
            <div class="card-body"><div class="chart-box-sm"><canvas id="cNiveaux" role="img" aria-label="Répartition par niveau"></canvas></div></div></div>
        </div>
        <div class="col-xl-4" data-section="academique">
          <div class="card h-100"><div class="card-header d-flex align-items-center"><h5>Taux de réussite (S1)</h5><button class="btn btn-sm btn-light ms-auto no-print" data-export="reussite"><i class="bi bi-file-earmark-excel"></i> Excel</button></div>
            <div class="card-body" id="tReussite"></div></div>
        </div>
        <div class="col-xl-4" data-section="academique">
          <div class="card h-100"><div class="card-header d-flex align-items-center"><h5>Statistiques d'absences</h5><button class="btn btn-sm btn-light ms-auto no-print" data-export="absences"><i class="bi bi-file-earmark-excel"></i> Excel</button></div>
            <div class="card-body"><div class="chart-box-sm"><canvas id="cAbsences" role="img" aria-label="Statistiques d'absences"></canvas></div></div></div>
        </div>
        <div class="col-xl-8" data-section="finance">
          <div class="card h-100"><div class="card-header d-flex align-items-center"><h5>Recettes par période</h5><button class="btn btn-sm btn-light ms-auto no-print" data-export="recettes"><i class="bi bi-file-earmark-excel"></i> Excel</button></div>
            <div class="card-body"><div class="chart-box"><canvas id="cRecettes" role="img" aria-label="Recettes par période"></canvas></div><div class="mt-2 text-sm" id="recettesTotal"></div></div></div>
        </div>
        <div class="col-xl-4" data-section="finance">
          <div class="card h-100"><div class="card-header d-flex align-items-center"><h5>Impayés par filière</h5><button class="btn btn-sm btn-light ms-auto no-print" data-export="impayes"><i class="bi bi-file-earmark-excel"></i> Excel</button></div>
            <div class="table-responsive"><table class="table table-sm"><thead><tr><th>Filière</th><th class="text-center">Étud.</th><th class="text-end">Reste dû</th></tr></thead><tbody id="tImpayes"></tbody></table></div></div>
        </div>
      </div>
    </main>
    <footer class="app-footer"></footer>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<script src="../../static/js/mock-data.js"></script>
<script src="../../static/js/services.js"></script>
<script src="../../static/js/core.js"></script>
<script src="../../static/js/charts.js"></script>
<script src="../../static/js/pages/rapports.js"></script>
</body>
</html>
