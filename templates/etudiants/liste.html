<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Étudiants · Campus360</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="../../static/css/campus360.css" rel="stylesheet">
</head>
<body data-page="etudiants" data-roles="admin,scolarite,comptable">
<div class="app-shell">
  <aside id="c360-sidebar" class="app-sidebar" aria-label="Navigation principale"></aside>
  <div class="app-main">
    <header id="c360-topbar" class="app-topbar"></header>
    <main class="app-content">
      <div class="page-header">
        <div>
          <h1>Étudiants</h1>
          <nav aria-label="Fil d'Ariane"><ol class="breadcrumb"><li class="breadcrumb-item"><a href="../dashboard/index.html">Accueil</a></li><li class="breadcrumb-item active">Étudiants</li></ol></nav>
        </div>
        <div class="actions">
          <button class="btn btn-light" id="btnExport"><i class="bi bi-file-earmark-excel me-1"></i>Exporter</button>
          <a href="formulaire.html" class="btn btn-primary" data-perm="write"><i class="bi bi-plus-lg me-1"></i>Ajouter un étudiant</a>
        </div>
      </div>

      <div class="card">
        <div class="card-body border-bottom">
          <!-- Django : <form method="get"> — les filtres deviennent des paramètres GET -->
          <div class="toolbar">
            <div class="search-box"><i class="bi bi-search"></i><input type="search" id="search" class="form-control" placeholder="Rechercher par nom ou matricule…" aria-label="Rechercher"></div>
            <select id="fFiliere" class="form-select" aria-label="Filière"></select>
            <select id="fNiveau" class="form-select" aria-label="Niveau"></select>
            <select id="fAnnee" class="form-select" aria-label="Année académique"></select>
            <select id="fStatut" class="form-select" aria-label="Statut">
              <option value="">Tous les statuts</option><option value="Actif" selected>Actifs</option><option value="Archivé">Archivés</option>
            </select>
            <span class="ms-auto text-secondary text-sm"><strong id="count">0</strong> étudiant(s)</span>
          </div>
        </div>
        <div class="table-responsive">
          <table class="table table-hover">
            <thead><tr><th>Étudiant</th><th>Matricule</th><th>Formation</th><th>Contact</th><th>Paiement</th><th>Statut</th><th class="text-end">Actions</th></tr></thead>
            <tbody id="tbody"></tbody>
          </table>
        </div>
      </div>
    </main>
    <footer class="app-footer"></footer>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="../../static/js/mock-data.js"></script>
<script src="../../static/js/services.js"></script>
<script src="../../static/js/core.js"></script>
<script src="../../static/js/pages/etudiants-liste.js"></script>
</body>
</html>
