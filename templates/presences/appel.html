<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Faire l'appel · Campus360</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="../../static/css/campus360.css" rel="stylesheet">
</head>
<body data-page="appel" data-roles="admin,scolarite,enseignant">
<div class="app-shell">
  <aside id="c360-sidebar" class="app-sidebar" aria-label="Navigation principale"></aside>
  <div class="app-main">
    <header id="c360-topbar" class="app-topbar"></header>
    <main class="app-content">
      <div class="page-header">
        <div>
          <h1>Faire l'appel</h1>
          <nav aria-label="Fil d'Ariane"><ol class="breadcrumb"><li class="breadcrumb-item"><a href="../dashboard/index.html">Accueil</a></li><li class="breadcrumb-item active">Présences</li></ol></nav>
        </div>
        <div class="actions"><a href="suivi.html" class="btn btn-outline-primary"><i class="bi bi-clock-history me-1"></i>Suivi des présences</a></div>
      </div>

      <div class="card mb-3"><div class="card-body">
        <div class="row g-3 align-items-end">
          <div class="col-md-7"><label class="form-label" for="aSeance">Séance</label><select id="aSeance" class="form-select"></select></div>
          <div class="col-md-3"><label class="form-label" for="aDate">Date</label><input type="date" id="aDate" class="form-control"></div>
          <div class="col-md-2"><button type="button" class="btn btn-light w-100" id="btnAllPresent"><i class="bi bi-check2-all me-1"></i>Tous présents</button></div>
        </div>
        <div id="dateWarning" class="mt-2"></div>
      </div></div>

      <form id="appelForm" novalidate>
        <div class="card">
          <div class="card-header d-flex flex-wrap align-items-center gap-2"><h5 class="me-auto">Liste d'appel</h5><span class="text-sm" id="appelStats"></span></div>
          <div class="table-responsive"><table class="table table-hover"><thead><tr><th>#</th><th>Étudiant</th><th class="text-center">Statut</th><th>Retard (min)</th><th>Observation</th></tr></thead><tbody id="appelBody"></tbody></table></div>
          <div class="card-footer bg-transparent text-end"><button class="btn btn-primary" type="submit"><i class="bi bi-save me-1"></i>Enregistrer l'appel</button></div>
        </div>
      </form>
    </main>
    <footer class="app-footer"></footer>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="../../static/js/mock-data.js"></script>
<script src="../../static/js/services.js"></script>
<script src="../../static/js/core.js"></script>
<script src="../../static/js/pages/appel.js"></script>
</body>
</html>
