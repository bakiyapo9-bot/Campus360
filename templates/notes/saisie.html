<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Saisie des notes · Campus360</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="../../static/css/campus360.css" rel="stylesheet">
</head>
<body data-page="saisie-notes" data-roles="admin,scolarite,enseignant">
<div class="app-shell">
  <aside id="c360-sidebar" class="app-sidebar" aria-label="Navigation principale"></aside>
  <div class="app-main">
    <header id="c360-topbar" class="app-topbar"></header>
    <main class="app-content">
      <div class="page-header">
        <div>
          <h1>Saisie des notes</h1>
          <nav aria-label="Fil d'Ariane"><ol class="breadcrumb"><li class="breadcrumb-item"><a href="../dashboard/index.html">Accueil</a></li><li class="breadcrumb-item"><a href="evaluations.html">Évaluations</a></li><li class="breadcrumb-item active">Saisie</li></ol></nav>
        </div>
      </div>

      <div class="card mb-3"><div class="card-body">
        <div class="row g-3 align-items-end">
          <div class="col-md-5"><label class="form-label" for="sMatiere">Matière</label><select id="sMatiere" class="form-select"></select></div>
          <div class="col-md-5"><label class="form-label" for="sEval">Évaluation</label><select id="sEval" class="form-select"></select></div>
          <div class="col-md-2"><a href="evaluations.html" class="btn btn-light w-100"><i class="bi bi-plus-lg me-1"></i>Évaluation</a></div>
        </div>
        <div id="evalInfo" class="mt-3"></div>
      </div></div>

      <form id="gradesForm" novalidate>
        <div class="card">
          <div class="card-header d-flex flex-wrap align-items-center gap-2">
            <h5 class="me-auto">Notes des étudiants</h5>
            <span class="text-sm text-secondary" id="gradeStats"></span>
          </div>
          <div class="table-responsive">
            <table class="table table-hover">
              <thead><tr><th>#</th><th>Étudiant</th><th>Matricule</th><th class="text-center">Note</th><th class="text-center">Absent</th><th class="text-center">Sur 20</th></tr></thead>
              <tbody id="gradesBody"></tbody>
            </table>
          </div>
          <div class="card-footer bg-transparent d-flex flex-wrap gap-2 justify-content-end">
            <div class="me-auto text-sm text-secondary align-self-center"><i class="bi bi-keyboard me-1"></i>Entrée = champ suivant · virgule ou point acceptés</div>
            <button type="button" class="btn btn-light" id="btnDraft"><i class="bi bi-save me-1"></i>Enregistrer le brouillon</button>
            <button type="submit" class="btn btn-primary"><i class="bi bi-check2-all me-1"></i>Valider les notes</button>
          </div>
        </div>
      </form>
    </main>
    <footer class="app-footer"></footer>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="../../static/js/mock-data.js"></script>
<script src="../../static/js/services.js"></script>
<script src="../../static/js/core.js"></script>
<script src="../../static/js/pages/saisie-notes.js"></script>
</body>
</html>
