<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Résultats · Campus360</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="../../static/css/campus360.css" rel="stylesheet">
</head>
<body data-page="resultats" data-roles="admin,scolarite,enseignant">
<div class="app-shell">
  <aside id="c360-sidebar" class="app-sidebar" aria-label="Navigation principale"></aside>
  <div class="app-main">
    <header id="c360-topbar" class="app-topbar"></header>
    <main class="app-content">
      <div class="page-header">
        <div>
          <h1>Résultats & moyennes</h1>
          <nav aria-label="Fil d'Ariane"><ol class="breadcrumb"><li class="breadcrumb-item"><a href="../dashboard/index.html">Accueil</a></li><li class="breadcrumb-item active">Résultats</li></ol></nav>
        </div>
        <div class="actions">
          <button class="btn btn-light" id="btnExport"><i class="bi bi-file-earmark-excel me-1"></i>Exporter</button>
          <button class="btn btn-light" data-print><i class="bi bi-printer me-1"></i>PV (PDF)</button>
          <button class="btn btn-success" id="btnPublish" data-perm="publish"><i class="bi bi-megaphone me-1"></i>Publier les résultats</button>
        </div>
      </div>

      <div class="card mb-3 no-print"><div class="card-body py-2"><div class="toolbar">
        <select id="fGroupe" class="form-select form-select-sm" aria-label="Groupe"></select>
        <select id="fSemestre" class="form-select form-select-sm" aria-label="Semestre"></select>
        <span class="ms-auto" id="publishState"></span>
      </div></div></div>

      <div class="row g-3 mb-3" id="stats"></div>

      <div class="card">
        <div class="table-responsive">
          <table class="table table-hover table-sm align-middle">
            <thead id="resHead"></thead>
            <tbody id="resBody"></tbody>
          </table>
        </div>
      </div>
    </main>
    <footer class="app-footer"></footer>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="../../static/js/mock-data.js"></script>
<script src="../../static/js/services.js"></script>
<script src="../../static/js/core.js"></script>
<script src="../../static/js/pages/resultats.js"></script>
</body>
</html>
