<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Nouveau mot de passe · Campus360</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="../../static/css/campus360.css" rel="stylesheet">
</head>
<body data-page="reset">
  <div class="min-vh-100 d-flex align-items-center justify-content-center p-3">
    <div class="card w-100" style="max-width:440px">
      <div class="card-body p-4 p-md-5">
        <div class="d-flex align-items-center gap-2 fs-5 fw-bold mb-4"><span class="brand-logo"><i class="bi bi-mortarboard-fill"></i></span> Campus360</div>
        <h1 class="h4 fw-bold">Définir un nouveau mot de passe</h1>
        <p class="text-secondary">Choisissez un mot de passe robuste que vous n'utilisez nulle part ailleurs.</p>
        <!-- Django : PasswordResetConfirmView — <form method="post"> {% csrf_token %} -->
        <form id="resetForm" method="post" novalidate>
          <div class="mb-3">
            <label class="form-label" for="new_password1">Nouveau mot de passe</label>
            <input type="password" id="new_password1" name="new_password1" class="form-control" required minlength="8" autocomplete="new-password">
            <div class="progress progress-thin mt-2"><div id="strengthBar" class="progress-bar" style="width:0"></div></div>
            <div class="form-text" id="strengthText">8 caractères minimum, avec majuscule, chiffre et caractère spécial.</div>
          </div>
          <div class="mb-4">
            <label class="form-label" for="new_password2">Confirmer le mot de passe</label>
            <input type="password" id="new_password2" name="new_password2" class="form-control" required autocomplete="new-password">
            <div class="invalid-feedback">Les mots de passe ne correspondent pas.</div>
          </div>
          <button class="btn btn-primary w-100" type="submit">Enregistrer le mot de passe</button>
        </form>
        <div class="text-center mt-4"><a href="login.html" class="text-sm"><i class="bi bi-arrow-left me-1"></i>Retour à la connexion</a></div>
      </div>
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../../static/js/mock-data.js"></script>
  <script src="../../static/js/services.js"></script>
  <script src="../../static/js/core.js"></script>
  <script src="../../static/js/pages/password-strength.js"></script>
  <script src="../../static/js/pages/reinitialiser-mot-de-passe.js"></script>
</body>
</html>
