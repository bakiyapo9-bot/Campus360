<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Fiche enseignant · Campus360</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="../../static/css/campus360.css" rel="stylesheet">
</head>
<body data-page="enseignants" data-roles="admin,scolarite" data-title="Fiche enseignant">
<div class="app-shell">
  <aside id="c360-sidebar" class="app-sidebar" aria-label="Navigation principale"></aside>
  <div class="app-main">
    <header id="c360-topbar" class="app-topbar"></header>
    <main class="app-content">
      <div class="page-header">
        <div>
          <h1>Fiche enseignant</h1>
          <nav aria-label="Fil d'Ariane"><ol class="breadcrumb"><li class="breadcrumb-item"><a href="../dashboard/index.html">Accueil</a></li><li class="breadcrumb-item"><a href="liste.html">Enseignants</a></li><li class="breadcrumb-item active">Fiche</li></ol></nav>
        </div>
      </div>
      <div id="header"></div>
      <div class="card">
        <div class="card-header p-0 px-2">
          <ul class="nav nav-tabs-line" role="tablist">
            <li class="nav-item"><button class="nav-link active" data-bs-toggle="tab" data-bs-target="#t-cours" type="button"><i class="bi bi-book me-1"></i>Cours affectés</button></li>
            <li class="nav-item"><button class="nav-link" data-bs-toggle="tab" data-bs-target="#t-edt" type="button"><i class="bi bi-calendar-week me-1"></i>Emploi du temps</button></li>
            <li class="nav-item"><button class="nav-link" data-bs-toggle="tab" data-bs-target="#t-classes" type="button"><i class="bi bi-people me-1"></i>Classes</button></li>
            <li class="nav-item"><button class="nav-link" data-bs-toggle="tab" data-bs-target="#t-dispo" type="button"><i class="bi bi-clock me-1"></i>Disponibilités</button></li>
          </ul>
        </div>
        <div class="card-body tab-content">
          <div class="tab-pane fade show active" id="t-cours">
            <form class="row g-2 align-items-end mb-3" id="assignForm" novalidate>
              <div class="col-md-8"><label class="form-label text-sm" for="assignMatiere">Affecter une matière</label><select id="assignMatiere" class="form-select" required></select></div>
              <div class="col-md-4"><button class="btn btn-primary w-100"><i class="bi bi-plus-lg me-1"></i>Affecter</button></div>
            </form>
            <div class="table-responsive"><table class="table"><thead><tr><th>Code</th><th>Matière</th><th>Formation</th><th class="text-center">Coef.</th><th>Volume</th><th></th></tr></thead><tbody id="coursBody"></tbody></table></div>
          </div>
          <div class="tab-pane fade" id="t-edt"><div id="edt"></div></div>
          <div class="tab-pane fade" id="t-classes"><div class="row g-3" id="classes"></div></div>
          <div class="tab-pane fade" id="t-dispo">
            <form class="row g-2 align-items-end mb-3" id="dispoForm" novalidate>
              <div class="col-md-4"><label class="form-label text-sm" for="dJour">Jour</label><select id="dJour" class="form-select" required><option value="1">Lundi</option><option value="2">Mardi</option><option value="3">Mercredi</option><option value="4">Jeudi</option><option value="5">Vendredi</option><option value="6">Samedi</option></select></div>
              <div class="col-md-3"><label class="form-label text-sm" for="dDebut">De</label><input type="time" id="dDebut" class="form-control" required value="08:00" min="07:00" max="20:00"></div>
              <div class="col-md-3"><label class="form-label text-sm" for="dFin">À</label><input type="time" id="dFin" class="form-control" required value="12:00" min="07:00" max="20:00"></div>
              <div class="col-md-2"><button class="btn btn-primary w-100">Ajouter</button></div>
            </form>
            <ul class="list-group" id="dispoList"></ul>
          </div>
        </div>
      </div>
    </main>
    <footer class="app-footer"></footer>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="../../static/js/mock-data.js"></script>
<script src="../../static/js/services.js"></script>
<script src="../../static/js/core.js"></script>
<script src="../../static/js/timetable.js"></script>
<script src="../../static/js/pages/enseignant-fiche.js"></script>
</body>
</html>
