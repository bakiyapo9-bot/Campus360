<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Impayés · Campus360</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="../../static/css/campus360.css" rel="stylesheet">
</head>
<body data-page="impayes" data-roles="admin,comptable">
<div class="app-shell">
  <aside id="c360-sidebar" class="app-sidebar" aria-label="Navigation principale"></aside>
  <div class="app-main">
    <header id="c360-topbar" class="app-topbar"></header>
    <main class="app-content">
      <div class="page-header">
        <div>
          <h1>Étudiants ayant des impayés</h1>
          <nav aria-label="Fil d'Ariane"><ol class="breadcrumb"><li class="breadcrumb-item"><a href="../dashboard/index.html">Accueil</a></li><li class="breadcrumb-item"><a href="paiements.html">Paiements</a></li><li class="breadcrumb-item active">Impayés</li></ol></nav>
        </div>
        <div class="actions">
          <button class="btn btn-light" id="btnPrint"><i class="bi bi-printer me-1"></i>PDF</button>
          <button class="btn btn-light" id="btnExport"><i class="bi bi-file-earmark-excel me-1"></i>Excel</button>
          <button class="btn btn-primary" id="btnRelance"><i class="bi bi-send me-1"></i>Relancer la sélection</button>
        </div>
      </div>

      <div class="row g-3 mb-3" id="summary"></div>

      <div class="card">
        <div class="card-body border-bottom no-print">
          <div class="toolbar">
            <div class="search-box"><i class="bi bi-search"></i><input type="search" id="search" class="form-control" placeholder="Nom ou matricule…" aria-label="Rechercher"></div>
            <select id="fFiliere" class="form-select" aria-label="Filière"></select>
            <select id="fNiveau" class="form-select" aria-label="Niveau"></select>
            <select id="fTaux" class="form-select" aria-label="Taux de paiement">
              <option value="">Tous les taux</option><option value="0">Aucun versement (0 %)</option><option value="50">Moins de 50 %</option><option value="100">Partiellement payé</option>
            </select>
          </div>
        </div>
        <div class="table-responsive">
          <table class="table table-hover">
            <thead><tr><th class="no-print" style="width:36px"><input type="checkbox" class="form-check-input" id="checkAll" aria-label="Tout sélectionner"></th><th>Étudiant</th><th>Formation</th><th class="text-end">Total dû</th><th class="text-end">Versé</th><th class="text-end">Reste à payer</th><th>Taux</th><th>Dernier versement</th><th class="text-end no-print">Actions</th></tr></thead>
            <tbody id="tbody"></tbody>
          </table>
        </div>
      </div>
    </main>
    <footer class="app-footer"></footer>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="../../static/js/mock-data.js"></script>
<script src="../../static/js/services.js"></script>
<script src="../../static/js/core.js"></script>
<script src="../../static/js/pages/impayes.js"></script>
</body>
</html>
