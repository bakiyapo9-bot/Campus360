<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Paiements · Campus360</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="../../static/css/campus360.css" rel="stylesheet">
</head>
<body data-page="paiements" data-roles="admin,comptable">
<div class="app-shell">
  <aside id="c360-sidebar" class="app-sidebar" aria-label="Navigation principale"></aside>
  <div class="app-main">
    <header id="c360-topbar" class="app-topbar"></header>
    <main class="app-content">
      <div class="page-header">
        <div>
          <h1>Paiements</h1>
          <nav aria-label="Fil d'Ariane"><ol class="breadcrumb"><li class="breadcrumb-item"><a href="../dashboard/index.html">Accueil</a></li><li class="breadcrumb-item active">Paiements</li></ol></nav>
        </div>
        <div class="actions">
          <button class="btn btn-light" id="btnExport"><i class="bi bi-file-earmark-excel me-1"></i>Exporter</button>
          <button class="btn btn-primary" id="btnNew"><i class="bi bi-plus-lg me-1"></i>Enregistrer un paiement</button>
        </div>
      </div>

      <div class="row g-3 mb-3" id="summary"></div>

      <ul class="nav nav-pills mb-3 gap-1" role="tablist">
        <li class="nav-item"><button class="nav-link active" data-bs-toggle="pill" data-bs-target="#p-transactions" type="button"><i class="bi bi-list-ul me-1"></i>Transactions</button></li>
        <li class="nav-item"><button class="nav-link" data-bs-toggle="pill" data-bs-target="#p-audit" type="button"><i class="bi bi-shield-check me-1"></i>Historique des opérations</button></li>
      </ul>

      <div class="tab-content">
        <div class="tab-pane fade show active" id="p-transactions">
          <div class="card">
            <div class="card-body border-bottom">
              <div class="toolbar">
                <div class="search-box"><i class="bi bi-search"></i><input type="search" id="search" class="form-control" placeholder="N° reçu, étudiant, matricule…" aria-label="Rechercher"></div>
                <select id="fMode" class="form-select" aria-label="Mode de paiement"><option value="">Tous les modes</option><option>Espèces</option><option>Mobile Money</option><option>Virement bancaire</option><option>Chèque</option></select>
                <select id="fStatut" class="form-select" aria-label="Statut"><option value="">Tous les statuts</option><option>Validé</option><option>Annulé</option></select>
                <input type="date" id="fDu" class="form-control" style="width:auto" aria-label="Du">
                <input type="date" id="fAu" class="form-control" style="width:auto" aria-label="Au">
              </div>
            </div>
            <div class="table-responsive">
              <table class="table table-hover">
                <thead><tr><th>N° reçu</th><th>Date</th><th>Étudiant</th><th>Motif</th><th>Mode</th><th class="text-end">Montant</th><th>Statut</th><th class="text-end">Actions</th></tr></thead>
                <tbody id="tbody"></tbody>
              </table>
            </div>
          </div>
        </div>
        <div class="tab-pane fade" id="p-audit">
          <div class="card">
            <div class="card-body border-bottom text-sm text-secondary"><i class="bi bi-info-circle me-1"></i>Aucun paiement validé n'est modifié : toute annulation ou correction est tracée ici (journal non modifiable).</div>
            <div class="table-responsive"><table class="table"><thead><tr><th>Date</th><th>Utilisateur</th><th>Opération</th><th>Détails</th></tr></thead><tbody id="auditBody"></tbody></table></div>
          </div>
        </div>
      </div>
    </main>
    <footer class="app-footer"></footer>
  </div>
</div>

<!-- Modale : enregistrement d'un paiement -->
<div class="modal fade" id="payModal" tabindex="-1" aria-labelledby="payTitle" aria-hidden="true">
  <div class="modal-dialog modal-lg modal-dialog-centered modal-dialog-scrollable">
    <div class="modal-content">
      <!-- Django : <form method="post"> {% csrf_token %} + champ caché idempotency_key -->
      <form id="payForm" method="post" novalidate>
        <input type="hidden" name="idempotency_key" id="idempotency_key">
        <div class="modal-header"><h5 class="modal-title" id="payTitle">Enregistrer un paiement</h5><button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Fermer"></button></div>
        <div class="modal-body">
          <div id="payErrors"></div>
          <div class="mb-3 position-relative">
            <label class="form-label" for="payStudentSearch">Étudiant *</label>
            <input type="search" id="payStudentSearch" class="form-control" placeholder="Rechercher par nom ou matricule…" autocomplete="off">
            <input type="hidden" id="etudiant_id" name="etudiant_id">
            <div class="list-group position-absolute w-100 shadow" id="payStudentResults" style="z-index:5"></div>
          </div>
          <div id="paySituation"></div>
          <div class="row g-3">
            <div class="col-md-6">
              <label class="form-label" for="montant">Montant (FCFA) *</label>
              <div class="input-group"><input type="number" id="montant" name="montant" class="form-control" required min="1" step="1"><span class="input-group-text">FCFA</span></div>
              <div class="d-flex flex-wrap gap-1 mt-1" id="quickAmounts"></div>
            </div>
            <div class="col-md-6"><label class="form-label" for="date">Date du paiement *</label><input type="date" id="date" name="date" class="form-control" required></div>
            <div class="col-md-6"><label class="form-label" for="mode">Mode de paiement *</label><select id="mode" name="mode" class="form-select" required><option value="">Choisir…</option><option>Espèces</option><option>Mobile Money</option><option>Virement bancaire</option><option>Chèque</option></select></div>
            <div class="col-md-6"><label class="form-label" for="reference_externe">Référence (transaction, chèque…)</label><input id="reference_externe" name="reference_externe" class="form-control" maxlength="60"></div>
            <div class="col-12"><label class="form-label" for="motif">Motif *</label><input id="motif" name="motif" class="form-control" required list="motifs" placeholder="ex. Tranche 2"><datalist id="motifs"><option>Frais d'inscription</option><option>Frais d'inscription + 1re tranche</option><option>Tranche 1</option><option>Tranche 2</option><option>Tranche 3</option><option>Solde</option></datalist></div>
            <div class="col-12">
              <div class="form-check"><input class="form-check-input" type="checkbox" id="exceptionnel" name="exceptionnel"><label class="form-check-label" for="exceptionnel">Opération exceptionnelle autorisée (montant supérieur au solde)</label></div>
              <div class="d-none mt-2" id="exceptionWrap"><label class="form-label text-sm" for="observation">Justification de l'opération exceptionnelle *</label><textarea id="observation" name="observation" class="form-control" rows="2"></textarea></div>
            </div>
          </div>
        </div>
        <div class="modal-footer">
          <div class="me-auto text-sm" id="newBalance"></div>
          <button type="button" class="btn btn-light" data-bs-dismiss="modal">Annuler</button>
          <button type="submit" class="btn btn-primary" id="paySubmit"><i class="bi bi-check2 me-1"></i>Valider le paiement</button>
        </div>
      </form>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="../../static/js/mock-data.js"></script>
<script src="../../static/js/services.js"></script>
<script src="../../static/js/core.js"></script>
<script src="../../static/js/pages/dossier-etudiant.js"></script>
<script src="../../static/js/pages/paiements.js"></script>
</body>
</html>
