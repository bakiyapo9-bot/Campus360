<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mon profil · Campus360</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="../../static/css/campus360.css" rel="stylesheet">
</head>
<body data-page="profil" data-title="Mon profil">
<div class="app-shell">
  <aside id="c360-sidebar" class="app-sidebar" aria-label="Navigation principale"></aside>
  <div class="app-main">
    <header id="c360-topbar" class="app-topbar"></header>
    <main class="app-content">
      <div class="page-header"><div><h1>Mon profil</h1></div></div>
      <div class="row g-3">
        <div class="col-lg-4">
          <div class="card mb-3"><div class="card-body text-center" id="profileCard"></div></div>
          <div class="card"><div class="card-header"><h5>Mes dernières connexions</h5></div><ul class="list-group list-group-flush" id="myLogins"></ul></div>
        </div>
        <div class="col-lg-8">
          <div class="card mb-3">
            <div class="card-header"><h5><i class="bi bi-person me-2"></i>Informations personnelles</h5></div>
            <!-- Django : <form method="post"> {% csrf_token %} -->
            <form class="card-body row g-3" id="profileForm" method="post" novalidate>
              <div class="col-md-6"><label class="form-label" for="pPrenom">Prénom *</label><input id="pPrenom" name="prenom" class="form-control" required></div>
              <div class="col-md-6"><label class="form-label" for="pNom">Nom *</label><input id="pNom" name="nom" class="form-control" required></div>
              <div class="col-md-6"><label class="form-label" for="pEmail">E-mail *</label><input type="email" id="pEmail" name="email" class="form-control" required><div class="invalid-feedback">E-mail invalide.</div></div>
              <div class="col-md-6"><label class="form-label" for="pTel">Téléphone</label><input type="tel" id="pTel" name="telephone" class="form-control" pattern="[+0-9 ]{8,20}"><div class="invalid-feedback">Numéro invalide.</div></div>
              <div class="col-md-6"><label class="form-label" for="pLangue">Langue</label><select id="pLangue" name="langue" class="form-select"><option value="fr">Français</option><option value="en">English</option></select></div>
              <div class="col-md-6 d-flex align-items-end"><div class="form-check form-switch"><input class="form-check-input" type="checkbox" role="switch" id="pNotif" name="notifications" checked><label class="form-check-label" for="pNotif">Recevoir les notifications par e-mail</label></div></div>
              <div class="col-12 text-end"><button class="btn btn-primary" type="submit"><i class="bi bi-check2 me-1"></i>Enregistrer</button></div>
            </form>
          </div>
          <div class="card" id="securite">
            <div class="card-header"><h5><i class="bi bi-key me-2"></i>Changer le mot de passe</h5></div>
            <!-- Django : PasswordChangeView — <form method="post"> {% csrf_token %} -->
            <form class="card-body row g-3" id="pwdForm" method="post" novalidate>
              <div class="col-12"><label class="form-label" for="old_password">Mot de passe actuel *</label><input type="password" id="old_password" name="old_password" class="form-control" required autocomplete="current-password"></div>
              <div class="col-md-6">
                <label class="form-label" for="new_password1">Nouveau mot de passe *</label>
                <input type="password" id="new_password1" name="new_password1" class="form-control" required minlength="8" autocomplete="new-password">
                <div class="progress progress-thin mt-2"><div id="strengthBar" class="progress-bar" style="width:0"></div></div>
                <div class="form-text" id="strengthText">8 caractères minimum, avec majuscule, chiffre et caractère spécial.</div>
              </div>
              <div class="col-md-6"><label class="form-label" for="new_password2">Confirmation *</label><input type="password" id="new_password2" name="new_password2" class="form-control" required autocomplete="new-password"><div class="invalid-feedback">Les mots de passe ne correspondent pas.</div></div>
              <div class="col-12 text-end"><button class="btn btn-primary" type="submit"><i class="bi bi-shield-check me-1"></i>Mettre à jour le mot de passe</button></div>
            </form>
          </div>
        </div>
      </div>
    </main>
    <footer class="app-footer"></footer>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="../../static/js/mock-data.js"></script>
<script src="../../static/js/services.js"></script>
<script src="../../static/js/core.js"></script>
<script src="../../static/js/pages/password-strength.js"></script>
<script src="../../static/js/pages/profil.js"></script>
</body>
</html>
