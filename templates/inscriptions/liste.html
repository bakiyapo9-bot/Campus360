<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Inscriptions · Campus360</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="../../static/css/campus360.css" rel="stylesheet">
</head>
<body data-page="inscriptions" data-roles="admin,scolarite">
<div class="app-shell">
  <aside id="c360-sidebar" class="app-sidebar" aria-label="Navigation principale"></aside>
  <div class="app-main">
    <header id="c360-topbar" class="app-topbar"></header>
    <main class="app-content">
      <div class="page-header">
        <div>
          <h1>Inscriptions</h1>
          <nav aria-label="Fil d'Ariane"><ol class="breadcrumb"><li class="breadcrumb-item"><a href="../dashboard/index.html">Accueil</a></li><li class="breadcrumb-item active">Inscriptions</li></ol></nav>
        </div>
        <div class="actions">
          <button class="btn btn-light" id="btnExport"><i class="bi bi-file-earmark-excel me-1"></i>Exporter</button>
          <a href="nouvelle.html?type=reinscription" class="btn btn-outline-primary"><i class="bi bi-arrow-repeat me-1"></i>Réinscription</a>
          <a href="nouvelle.html" class="btn btn-primary"><i class="bi bi-plus-lg me-1"></i>Nouvelle inscription</a>
        </div>
      </div>

      <div class="row g-3 mb-3" id="summary"></div>

      <div class="card">
        <div class="card-body border-bottom">
          <div class="toolbar">
            <div class="search-box"><i class="bi bi-search"></i><input type="search" id="search" class="form-control" placeholder="Nom, prénom ou matricule…" aria-label="Rechercher"></div>
            <select id="fAnnee" class="form-select" aria-label="Année académique"></select>
            <select id="fFiliere" class="form-select" aria-label="Filière"></select>
            <select id="fNiveau" class="form-select" aria-label="Niveau"></select>
            <select id="fType" class="form-select" aria-label="Type"><option value="">Tous les types</option><option>Nouvelle</option><option>Réinscription</option></select>
            <select id="fStatut" class="form-select" aria-label="Statut"><option value="">Tous les statuts</option><option>En attente</option><option>Validée</option><option>Rejetée</option></select>
          </div>
        </div>
        <div class="table-responsive">
          <table class="table table-hover">
            <thead><tr><th>Étudiant</th><th>Année</th><th>Formation</th><th>Type</th><th>Date</th><th>Dossier</th><th>Statut</th><th class="text-end">Actions</th></tr></thead>
            <tbody id="tbody"></tbody>
          </table>
        </div>
      </div>
    </main>
    <footer class="app-footer"></footer>
  </div>
</div>

<!-- Détail / vérification du dossier -->
<div class="modal fade" id="detailModal" tabindex="-1" aria-labelledby="detailTitle" aria-hidden="true">
  <div class="modal-dialog modal-lg modal-dialog-centered modal-dialog-scrollable">
    <div class="modal-content">
      <div class="modal-header"><h5 class="modal-title" id="detailTitle">Dossier d'inscription</h5><button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Fermer"></button></div>
      <div class="modal-body" id="detailBody"></div>
      <div class="modal-footer" id="detailFooter"></div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="../../static/js/mock-data.js"></script>
<script src="../../static/js/services.js"></script>
<script src="../../static/js/core.js"></script>
<script src="../../static/js/pages/inscriptions.js"></script>
</body>
</html>
